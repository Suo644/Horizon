<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Browser</title>
    <!-- Include Ultraviolet configuration scripts -->
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #121212; overflow: hidden; }
        
        /* Top Browser Control Bar */
        .browser-bar { background: #202124; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #3c4043; }
        .nav-btn { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.1); }
        
        /* Address Bar Form */
        .address-form { flex-grow: 1; display: flex; }
        .address-input { width: 100%; padding: 8px 16px; border-radius: 20px; border: none; background: #303134; color: #fff; font-size: 14px; outline: none; transition: background 0.2s; }
        .address-input:focus { background: #3c4043; box-shadow: 0 0 0 2px #8ab4f8; }
        
        /* Content Window Area */
        .content-area { flex-grow: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        
        /* Welcome Splash Screen */
        .splash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e1e; color: #aaa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 10; }
        .splash h1 { color: #fff; margin-bottom: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Browser Controls -->
    <div class="browser-bar">
        <button class="nav-btn" id="back-btn" title="Back">◀</button>
        <button class="nav-btn" id="forward-btn" title="Forward">▶</button>
        <button class="nav-btn" id="reload-btn" title="Reload">🔄</button>
        <button class="nav-btn" id="home-btn" title="Home">🏠</button>
        
        <form class="address-form" id="address-form">
            <input class="address-input" id="address-input" type="text" placeholder="Search Google or enter a URL" autofocus autocomplete="off">
        </form>
    </div>

    <!-- Web Display Container -->
    <div class="content-area">
        <!-- Home Splash Screen -->
        <div class="splash" id="splash-screen">
            <h1>New Tab</h1>
            <p>Type a URL or search term above to begin browsing securely.</p>
        </div>
        
        <!-- The Sandbox Browser Window -->
        <iframe id="browser-frame" class="hidden"></iframe>
    </div>

    <script>
        const form = document.getElementById('address-form');
        const input = document.getElementById('address-input');
        const iframe = document.getElementById('browser-frame');
        const splash = document.getElementById('splash-screen');

        // Navigation Buttons
        document.getElementById('back-btn').onclick = () => { try { iframe.contentWindow.history.back(); } catch(e){} };
        document.getElementById('forward-btn').onclick = () => { try { iframe.contentWindow.history.forward(); } catch(e){} };
        document.getElementById('reload-btn').onclick = () => { iframe.src = iframe.src; };
        document.getElementById('home-btn').onclick = () => {
            iframe.classList.add('hidden');
            splash.classList.remove('hidden');
            input.value = '';
        };

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let url = input.value.trim();
            if (!url) return;

            // Search engine fallback if it's not a direct URL
            if (!url.includes('.') || url.includes(' ')) {
                url = 'https://google.com' + encodeURIComponent(url);
            } else if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Register Ultraviolet Service Worker and Load URL
            if (typeof __uv$config !== 'undefined') {
                // Ensure service worker path matches template structure
                const swPrefix = __uv$config.prefix || '/uv/service/';
                
                navigator.serviceWorker.register('/uv.sw.js', {
                    scope: __uv$config.prefix
                }).then(() => {
                    // Encode the target URL using Ultraviolet's built-in function
                    const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
                    
                    // Switch views and load site
                    splash.classList.add('hidden');
                    iframe.classList.remove('hidden');
                    iframe.src = proxiedUrl;
                }).catch((err) => {
                    alert('Failed to register proxy service worker: ' + err.message);
                });
            } else {
                alert('Ultraviolet config script not found. Check repository files.');
            }
        });
    </script>
</body>
</html>

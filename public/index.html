<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Browser</title>
    <!-- Include Ultraviolet configuration scripts -->
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0b0f19; overflow: hidden; color: #fff; }
        
        /* Top Browser Control Bar */
        .browser-bar { background: #111827; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1f2937; }
        .nav-btn { background: none; border: none; color: #9ca3af; font-size: 16px; cursor: pointer; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: #6366f1; }
        
        /* Address Bar Form */
        .address-form { flex-grow: 1; display: flex; }
        .address-input { width: 100%; padding: 8px 18px; border-radius: 20px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
        .address-input:focus { background: #111827; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3); }
        
        /* Content Window Area */
        .content-area { flex-grow: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        
        /* Welcome Splash Screen */
        .splash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #111827 0%, #070a13 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
        
        /* Horizon Theme Logo Styling */
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-text { font-size: 48px; font-weight: 800; tracking: -0.05em; background: linear-gradient(to right, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .logo-tagline { font-size: 14px; color: #9ca3af; letter-spacing: 2px; text-transform: uppercase; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Browser Controls -->
    <div class="browser-bar">
        <button class="nav-btn" id="back-btn" title="Back">◀</button>
        <button class="nav-btn" id="forward-btn" title="Forward">▶</button>
        <button class="nav-btn" id="reload-btn" title="Reload">🔄</button>
        <button class="nav-btn" id="home-btn" title="Home">🏠</button>
        
        <form class="address-form" id="address-form">
            <input class="address-input" id="address-input" type="text" placeholder="Search with Horizon or type a URL..." autofocus autocomplete="off">
        </form>
    </div>

    <!-- Web Display Container -->
    <div class="content-area">
        <!-- Horizon Splash Screen -->
        <div class="splash" id="splash-screen">
            <div class="logo-container">
                <div class="logo-text">HORIZON</div>
                <div class="logo-tagline">Explore Without Limits</div>
            </div>
        </div>
        
        <!-- The Sandbox Browser Window -->
        <iframe id="browser-frame" class="hidden"></iframe>
    </div>

    <script>
        const form = document.getElementById('address-form');
        const input = document.getElementById('address-input');
        const iframe = document.getElementById('browser-frame');
        const splash = document.getElementById('splash-screen');

        // Navigation Buttons
        document.getElementById('back-btn').onclick = () => { try { iframe.contentWindow.history.back(); } catch(e){} };
        document.getElementById('forward-btn').onclick = () => { try { iframe.contentWindow.history.forward(); } catch(e){} };
        document.getElementById('reload-btn').onclick = () => { iframe.src = iframe.src; };
        document.getElementById('home-btn').onclick = () => {
            iframe.classList.add('hidden');
            splash.classList.remove('hidden');
            input.value = '';
        };

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let url = input.value.trim();
            if (!url) return;

            // Search engine fallback if it's not a direct URL
            if (!url.includes('.') || url.includes(' ')) {
                url = 'https://google.com' + encodeURIComponent(url);
            } else if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Register Ultraviolet Service Worker and Load URL
            if (typeof __uv$config !== 'undefined') {
                const swPrefix = __uv$config.prefix || '/uv/service/';
                
                navigator.serviceWorker.register('/uv.sw.js', {
                    scope: __uv$config.prefix
                }).then(() => {
                    const proxiedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
                    
                    splash.classList.add('hidden');
                    iframe.classList.remove('hidden');
                    iframe.src = proxiedUrl;
                }).catch((err) => {
                    alert('Failed to register proxy service worker: ' + err.message);
                });
            } else {
                alert('Ultraviolet config script not found. Check repository files.');
            }
        });
    </script>
</body>
</html>
